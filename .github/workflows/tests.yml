name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
      - run: python server/run_server.py --selftest --project tests
      - run: python tests/benchmark/benchmark.py
